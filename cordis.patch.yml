# dsh-sound-notify bundle patch: inserts the plugin row over the composed
# profile. The row enables the plugin and seeds the values of this entry's
# settings namespace; values already saved in the profile's settings document
# take precedence. Config is validated against the plugin's exported Config
# schema at load.
#
# SETTINGS NAMESPACE: since DSH 0.1.7-rc.2 the namespace is keyed by this row's
# `id` below ("dsh-sound-notify") and is built from the volatile fields of that
# Config schema — the plugin does not register a namespace itself. The row id is
# therefore also the key under which preferences are persisted, and it must stay
# in sync with SETTINGS_NS in lib/config.js (asserted by test/index.test.mjs and
# read by the browser half through ctx.configForms).
#
# Edit this file (or the profile's own cordis.patch.yml, which outranks it) to
# change defaults, then restart the profile process.
#
# PATCH IDS: patch rows target the entry's composed id (options.id —
# "dsh-sound-notify"), NOT the loader's namespaced runtime id
# ("include:dsh-sound-notify"). Writing the namespaced id matches nothing and
# is silently skipped (warn: "patch: entry not found").

- insert:
    - id: dsh-sound-notify
      name: dsh-sound-notify
      config:
        enabled: true
        soundDone: true
        soundAttention: true
        onlyWhenHidden: false
        volume: 0.25

# To disable this row from the profile's own cordis.patch.yml, target the
# composed id, not the namespaced runtime id:
# - id: dsh-sound-notify
#   disabled: true
